services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d controle_financeiro"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/api
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # As dependências ficam em um volume do Docker, separadas da pasta do Windows.
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  dados_postgres:
  web_node_modules:
