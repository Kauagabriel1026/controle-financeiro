# Descreve a API para o Render (render.com): ele lê este arquivo e cria o serviço.
services:
  - type: web
    name: kamel-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api/health
    envVars:
      # Gerada pelo Render na criação do serviço.
      - key: APP_KEY
        generateValue: true
      # Preenchidas à mão no painel do Render: o endereço do banco no Neon
      # e o endereço do front-end no Vercel.
      - key: DB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
