# Limita os processos do Apache para caber em uma máquina de 512 MB de memória.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       8
    MaxConnectionsPerChild  500
</IfModule>

# Não revela a versão do servidor nas respostas.
ServerTokens Prod
ServerSignature Off
