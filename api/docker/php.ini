; Guarda o código já compilado em memória, em vez de ler e compilar os
; arquivos PHP a cada requisição. Alterações no código valem em até 2 segundos.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.max_accelerated_files=20000
opcache.memory_consumption=192

; Evita repetir a resolução de caminhos de arquivo a cada requisição.
realpath_cache_size=4096K
realpath_cache_ttl=600
