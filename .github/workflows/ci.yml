name: CI

on:
  push:
    branches: [main]
  pull_request:

# Com bash explícito, um comando que falha antes de um "| tee" reprova a etapa.
defaults:
  run:
    shell: bash

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: controle_financeiro
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro -d controle_financeiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Aplicar migrations no PostgreSQL
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1

      - name: Rodar testes
        run: |
          php artisan test | tee resultado.txt
          echo "::notice title=Testes da API (SQLite)::$(grep -E 'Tests:' resultado.txt | sed 's/\x1b\[[0-9;]*m//g' | xargs)"

      - name: Rodar testes no PostgreSQL
        run: |
          php artisan test | tee resultado.txt
          echo "::notice title=Testes da API (PostgreSQL)::$(grep -E 'Tests:' resultado.txt | sed 's/\x1b\[[0-9;]*m//g' | xargs)"
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: controle_financeiro

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar o código
        run: npm run lint

      - name: Rodar testes
        run: npm test

      - name: Gerar a versão de produção
        run: npm run build

  # Ponta a ponta: um navegador de verdade usando o front e a API reais, com PostgreSQL.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: controle_financeiro
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro -d controle_financeiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Subir a API
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          php artisan key:generate
          php artisan migrate --force
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/servidor.log 2>&1 &
          curl --silent --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/health

      - name: Preparar o front-end
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Rodar o teste de ponta a ponta
        working-directory: web
        run: npm run test:e2e

      - name: Mostrar o log da API se algo falhar
        if: failure()
        working-directory: api
        run: |
          registro=$( (tail -c 2000 storage/logs/laravel.log 2>/dev/null || echo "sem laravel.log"); echo; echo "--- servidor ---"; tail -n 25 storage/logs/servidor.log 2>/dev/null)
          registro="${registro//'%'/'%25'}"
          registro="${registro//$'\n'/'%0A'}"
          echo "::error title=Log da API::$registro"

  # Confere que o ambiente do README (docker compose up) sobe de verdade.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Subir com Docker Compose
        run: docker compose up -d --build

      - name: Esperar a API e o front-end responderem
        run: |
          curl --silent --fail --retry 90 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health
          curl --silent --fail --retry 60 --retry-delay 2 --retry-all-errors --output /dev/null http://localhost:5173

      - name: Rodar os testes dentro dos contêineres
        run: |
          if ! docker compose exec -T api php artisan test > resultado-api.txt 2>&1; then
            registro=$(sed 's/\x1b\[[0-9;]*m//g' resultado-api.txt | grep -B2 -A25 -E 'FAIL|Failed|Error' | head -c 3500)
            registro="${registro//'%'/'%25'}"
            registro="${registro//$'\n'/'%0A'}"
            echo "::error title=Testes da API no Docker::$registro"
            exit 1
          fi
          echo "::notice title=Testes da API no Docker::$(grep -E 'Tests:' resultado-api.txt | sed 's/\x1b\[[0-9;]*m//g' | xargs)"
          docker compose exec -T web npm test

      - name: Medir o tempo de resposta da API
        run: |
          tempos=""
          for i in $(seq 1 15); do
            tempos="$tempos $(curl --silent --output /dev/null --write-out '%{time_total}' http://localhost:8000/api/health)"
          done
          echo "::notice title=Tempo de resposta da API no Docker (15 chamadas, em segundos)::$tempos"
          opcache=$(docker compose exec -T api php -r 'echo function_exists("opcache_get_status") ? "ativo" : "inativo";')
          echo "::notice title=OPcache::$opcache"

      - name: Mostrar os logs se algo falhar
        if: failure()
        run: |
          registro=$(docker compose logs --no-color --tail 40 api web | tail -c 3500)
          registro="${registro//'%'/'%25'}"
          registro="${registro//$'\n'/'%0A'}"
          echo "::error title=Logs do Docker Compose::$registro"

  # Monta a imagem de produção e confere, com ela no ar, o que muda em relação
  # ao ambiente de desenvolvimento: sem modo debug, CORS restrito e demonstração.
  producao:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: controle_financeiro
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro -d controle_financeiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      API: http://127.0.0.1:10000/api
      FRONT: https://kamel.example

    steps:
      - uses: actions/checkout@v4

      - name: Montar a imagem de produção
        run: docker build --file api/Dockerfile.prod --tag kamel-api api

      - name: Subir a API como na hospedagem
        run: |
          docker run --detach --name kamel-api --network host \
            --env PORT=10000 \
            --env APP_KEY=um-segredo-qualquer-de-teste \
            --env DB_URL=postgresql://financeiro:financeiro@127.0.0.1:5432/controle_financeiro \
            --env CORS_ALLOWED_ORIGINS=$FRONT \
            kamel-api
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors $API/health

      - name: Conferir que o modo debug está desligado
        run: |
          ambiente=$(docker exec kamel-api php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("app.env")." debug=".var_export(config("app.debug"), true);')
          echo "::notice title=Ambiente da imagem de produção::$ambiente"
          test "$ambiente" = "production debug=false"

          # Um erro interno não pode devolver detalhes do código.
          corpo=$(curl --silent $API/rota-que-nao-existe)
          echo "::notice title=Resposta a uma rota inexistente::$corpo"
          ! echo "$corpo" | grep -qiE 'exception|trace|vendor/'

      - name: Conferir o CORS
        run: |
          permitido=$(curl --silent --output /dev/null --dump-header - --header "Origin: $FRONT" $API/health | grep -i '^access-control-allow-origin' | tr -d '\r' || true)
          outro=$(curl --silent --output /dev/null --dump-header - --header "Origin: https://outro-site.example" $API/health | grep -i '^access-control-allow-origin' | tr -d '\r' || true)
          echo "::notice title=CORS::front: [$permitido] | outro site: [$outro]"
          echo "$permitido" | grep -qi "$FRONT"
          ! echo "$outro" | grep -qi "outro-site.example"

      - name: Conferir a demonstração
        run: |
          token=$(curl --silent --fail --request POST --header "Accept: application/json" $API/demonstracao | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          vencidas=$(curl --silent --fail --header "Accept: application/json" --header "Authorization: Bearer $token" "$API/contas?status=vencida" | python3 -c "import json,sys; print(json.load(sys.stdin)['meta']['total'])")
          contas=$(curl --silent --fail --header "Accept: application/json" --header "Authorization: Bearer $token" "$API/contas" | python3 -c "import json,sys; print(json.load(sys.stdin)['meta']['total'])")
          echo "::notice title=Demonstração na imagem de produção::$contas contas, $vencidas vencida"
          test "$contas" = "61"
          test "$vencidas" = "1"

      - name: Medir o tempo de resposta
        run: |
          tempos=""
          for i in $(seq 1 10); do
            tempos="$tempos $(curl --silent --output /dev/null --write-out '%{time_total}' $API/health)"
          done
          echo "::notice title=Tempo de resposta da imagem de produção (10 chamadas, em segundos)::$tempos"

      - name: Mostrar os logs se algo falhar
        if: failure()
        run: |
          registro=$(docker logs kamel-api 2>&1 | tail -c 3500)
          registro="${registro//'%'/'%25'}"
          registro="${registro//$'\n'/'%0A'}"
          echo "::error title=Logs da imagem de produção::$registro"
